name: CI & Auto-Merge to Main

on:
  push:
    branches-ignore:
      - main  # Sonsuz döngüyü önlemek için sadece feature branch'lerde çalışır

permissions:
  contents: write  # Main'e otomatik push yetkisi

jobs:
  test-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Merge işlemi için tam git geçmişi gerekir

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

      - name: Auto-merge to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff origin/${GITHUB_REF_NAME} -m "chore(ci): auto-merge ${GITHUB_REF_NAME} after passing tests"
          git push origin main